; Awning build: WLED-MM 14.7.3 + PacMan effects, Fade On, remote changes (ON = #10, OFF = #11 wipe-off, moon = #8),
; PacMan-button restart fix and the frame hook. Pick ONE of these in PlatformIO (Project Tasks):
;   awning_4MB   for an Elite whose WLED Info page says 4 MB flash
;   awning_16MB  for 16 MB flash
; Both are Wi-Fi builds with ESP-NOW (the remote) on. Ethernet is not used.
[platformio]
default_envs = awning_4MB

[env:awning_4MB]
extends = env:esp32_4MB_M
build_flags = ${env:esp32_4MB_M.build_flags}
  -D WLED_DISABLE_ALEXA     ;; frees flash: the 4 MB build is ~97% full before the awning effects
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_INFRARED

[env:awning_16MB]
extends = env:esp32_16MB_M

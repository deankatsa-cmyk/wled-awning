name: Build awning firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm run build
      - run: pip install -r requirements.txt || pip install platformio
      - run: pio run -e awning_V4 | tee v4.log
      - run: grep -c esp_now .pio/build/awning_V4/firmware.map && grep -q 'aw_rotTick' .pio/build/awning_V4/firmware.map
      - run: pio run -e awning_4MB
        continue-on-error: true
      - run: ls -la build_output/firmware .pio/build/awning_4MB/*.bin || true
      - uses: actions/upload-artifact@v4
        with:
          name: awning-firmware
          path: |
            build_output/firmware/*.bin
            .pio/build/awning_4MB/firmware.bin
            .pio/build/awning_V4/firmware.bin
            .pio/build/awning_V4/bootloader.bin
            .pio/build/awning_V4/partitions.bin
            .pio/build/awning_4MB/bootloader.bin
            .pio/build/awning_4MB/partitions.bin
      - name: Publish firmware to the firmware branch
        run: |
          mkdir -p /tmp/fw && cp build_output/firmware/*.bin /tmp/fw/ && ls -la /tmp/fw
          cp .pio/build/awning_V4/bootloader.bin /tmp/fw/awning_V4_bootloader.bin || true
          cp .pio/build/awning_V4/partitions.bin /tmp/fw/awning_V4_partitions.bin || true
          cd /tmp/fw && git init -q && git checkout -q -b firmware && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Firmware from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" firmware
